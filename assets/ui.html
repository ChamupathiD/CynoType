<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CynoType</title>
<style>
  /* ==========================================================================
     CynoType — macOS Liquid Glass Design System (Apple Design Science)
     Strictly 4 harmonious colors per appearance:
       1. Translucent atmospheric canvas (over native macOS vibrancy)
       2. Layered optical Liquid Glass surfaces + luminous specular rims
       3. Neutral ink hierarchy (#1D1D1F light / #F5F5F7 dark)
       4. Restrained Apple system blue accent (#0071E3 light / #0A84FF dark)
     Spacing: strict 8px grid (8 / 16 / 24 / 32)
     Weights: 400 (Regular), 500 (Medium), 600 (Semibold)
     ========================================================================== */

  :root {
    --canvas: linear-gradient(
      160deg,
      rgba(244, 247, 253, 0.56) 0%,
      rgba(245, 245, 248, 0.48) 52%,
      rgba(236, 242, 251, 0.58) 100%
    );
    --ambient-glow-1: rgba(0, 113, 227, 0.08);
    --ambient-glow-2: rgba(255, 255, 255, 0.65);

    --glass-card: linear-gradient(
      155deg,
      rgba(255, 255, 255, 0.78) 0%,
      rgba(255, 255, 255, 0.54) 55%,
      rgba(248, 251, 255, 0.70) 100%
    );
    --glass-well: rgba(255, 255, 255, 0.76);
    --glass-pill: linear-gradient(
      180deg,
      rgba(255, 255, 255, 0.62) 0%,
      rgba(245, 247, 252, 0.44) 100%
    );
    --glass-thumb: linear-gradient(
      180deg,
      rgba(255, 255, 255, 0.98) 0%,
      rgba(247, 249, 253, 0.92) 100%
    );
    --glass-rim:
      inset 0 1px 0.5px rgba(255, 255, 255, 0.95),
      inset 0 -0.5px 0 rgba(29, 29, 31, 0.06),
      inset 1px 0 0 rgba(255, 255, 255, 0.52);
    --glass-outer-stroke: 0 0 0 0.5px rgba(29, 29, 31, 0.09);
    --glass-shadow:
      0 2px 6px rgba(15, 23, 42, 0.04),
      0 14px 36px rgba(15, 23, 42, 0.075);
    --pill-shadow:
      0 1px 3px rgba(15, 23, 42, 0.10),
      0 2px 8px rgba(15, 23, 42, 0.06),
      inset 0 1px 0 rgba(255, 255, 255, 0.95);
    --specular-spot: rgba(255, 255, 255, 0.55);

    --ink: #1D1D1F;
    --ink-secondary: rgba(29, 29, 31, 0.58);
    --ink-tertiary: rgba(29, 29, 31, 0.38);
    --hairline: rgba(29, 29, 31, 0.08);
    --hairline-strong: rgba(29, 29, 31, 0.14);
    --control-fill: rgba(29, 29, 31, 0.055);
    --control-hover: rgba(29, 29, 31, 0.095);
    --switch-off: rgba(29, 29, 31, 0.16);

    --accent: #0071E3;
    --accent-top: #1A86FF;
    --accent-hover: #0066CC;
    --accent-ring: rgba(0, 113, 227, 0.24);
    --accent-shadow: rgba(0, 113, 227, 0.30);

    --stop-bg: linear-gradient(180deg, rgba(44, 44, 48, 0.92) 0%, rgba(24, 24, 27, 0.96) 100%);
    --stop-fg: #FFFFFF;

    --radius-card: 18px;
    --radius-well: 12px;
    --radius-pill: 999px;
    --ease-apple: cubic-bezier(0.22, 1, 0.36, 1);

    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI Variable Text", "Segoe UI", "Helvetica Neue", sans-serif;
    --font-mono: "SF Mono", ui-monospace, "Cascadia Code", "Consolas", "Menlo", monospace;
  }

  /* Dark Liquid Glass (macOS Tahoe DarkAqua) */
  body.theme-dark {
    --canvas: linear-gradient(
      160deg,
      rgba(20, 22, 29, 0.72) 0%,
      rgba(15, 16, 21, 0.68) 52%,
      rgba(19, 23, 33, 0.76) 100%
    );
    --ambient-glow-1: rgba(10, 132, 255, 0.14);
    --ambient-glow-2: rgba(255, 255, 255, 0.05);

    --glass-card: linear-gradient(
      155deg,
      rgba(48, 51, 62, 0.56) 0%,
      rgba(32, 34, 42, 0.46) 58%,
      rgba(42, 46, 58, 0.54) 100%
    );
    --glass-well: rgba(18, 19, 25, 0.56);
    --glass-pill: linear-gradient(
      180deg,
      rgba(255, 255, 255, 0.10) 0%,
      rgba(255, 255, 255, 0.05) 100%
    );
    --glass-thumb: linear-gradient(
      180deg,
      rgba(255, 255, 255, 0.24) 0%,
      rgba(255, 255, 255, 0.15) 100%
    );
    --glass-rim:
      inset 0 1px 0.5px rgba(255, 255, 255, 0.22),
      inset 0 -0.5px 0 rgba(0, 0, 0, 0.35),
      inset 1px 0 0 rgba(255, 255, 255, 0.10);
    --glass-outer-stroke: 0 0 0 0.5px rgba(255, 255, 255, 0.12);
    --glass-shadow:
      0 4px 12px rgba(0, 0, 0, 0.24),
      0 18px 44px rgba(0, 0, 0, 0.38);
    --pill-shadow:
      0 2px 6px rgba(0, 0, 0, 0.32),
      inset 0 1px 0 rgba(255, 255, 255, 0.26);
    --specular-spot: rgba(255, 255, 255, 0.12);

    --ink: #F5F5F7;
    --ink-secondary: rgba(245, 245, 247, 0.62);
    --ink-tertiary: rgba(245, 245, 247, 0.38);
    --hairline: rgba(255, 255, 255, 0.09);
    --hairline-strong: rgba(255, 255, 255, 0.16);
    --control-fill: rgba(255, 255, 255, 0.08);
    --control-hover: rgba(255, 255, 255, 0.14);
    --switch-off: rgba(255, 255, 255, 0.18);

    --accent: #0A84FF;
    --accent-top: #329BFF;
    --accent-hover: #0077ED;
    --accent-ring: rgba(10, 132, 255, 0.32);
    --accent-shadow: rgba(10, 132, 255, 0.34);

    --stop-bg: linear-gradient(180deg, rgba(245, 245, 247, 0.94) 0%, rgba(226, 228, 234, 0.92) 100%);
    --stop-fg: #1D1D1F;
  }

  /* Solid atmospheric mesh fallback on Windows / Linux WebView2 */
  body.platform-win {
    --canvas: linear-gradient(155deg, #EEF3FB 0%, #F4F5F8 52%, #E8EFFA 100%);
  }
  body.platform-win.theme-dark {
    --canvas: linear-gradient(155deg, #151822 0%, #111319 52%, #141A26 100%);
  }
  body.platform-win .app {
    padding-top: 24px;
  }

  * {
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 400;
    line-height: 1.45;
    user-select: none;
    -webkit-user-select: none;
    transition: color 240ms var(--ease-apple);
  }

  /* Soft Liquid Glass ambient refraction field */
  body::before,
  body::after {
    content: "";
    position: fixed;
    pointer-events: none;
    z-index: 0;
    border-radius: 50%;
    filter: blur(64px);
    transition: background 320ms var(--ease-apple);
  }
  body::before {
    width: 440px;
    height: 440px;
    top: -120px;
    right: -80px;
    background: radial-gradient(circle, var(--ambient-glow-1) 0%, transparent 72%);
  }
  body::after {
    width: 520px;
    height: 360px;
    bottom: -140px;
    left: -100px;
    background: radial-gradient(circle, var(--ambient-glow-2) 0%, transparent 72%);
  }

  .app {
    position: relative;
    z-index: 1;
    height: 100%;
    width: 100%;
    max-width: 780px;
    margin: 0 auto;
    padding: 40px 32px 24px 32px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* --------------------------------------------------------------------------
     1. Liquid Glass Surface System (with subtle pointer-reactive specular sheen)
     -------------------------------------------------------------------------- */
  .glass-panel {
    position: relative;
    background: var(--glass-card);
    -webkit-backdrop-filter: blur(36px) saturate(200%);
    backdrop-filter: blur(36px) saturate(200%);
    border-radius: var(--radius-card);
    box-shadow: var(--glass-shadow), var(--glass-rim), var(--glass-outer-stroke);
    transition: box-shadow 240ms var(--ease-apple), background 240ms var(--ease-apple);
  }

  .glass-panel::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: radial-gradient(
      340px circle at var(--mx, 28%) var(--my, 0%),
      var(--specular-spot) 0%,
      transparent 65%
    );
    opacity: 0.45;
    transition: opacity 260ms var(--ease-apple);
  }

  .glass-panel:hover::before {
    opacity: 0.72;
  }

  /* --------------------------------------------------------------------------
     2. Permission Notice (Liquid Glass strip, shown only if macOS blocks access)
     -------------------------------------------------------------------------- */
  .permission-banner {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 16px;
    animation: fadeSlideIn 220ms var(--ease-apple);
  }
  .permission-banner.visible {
    display: flex;
  }
  .permission-copy {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .permission-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
  }
  .permission-desc {
    font-size: 12px;
    color: var(--ink-secondary);
  }
  .permission-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  /* --------------------------------------------------------------------------
     3. Header (Brand Identity + Liquid Glass Mode Capsule + Appearance Toggle)
     -------------------------------------------------------------------------- */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 0 4px;
    flex-shrink: 0;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
    min-width: 0;
  }

  .brand-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    overflow: hidden;
    background: #0A0A0C;
    box-shadow:
      0 4px 14px rgba(15, 23, 42, 0.22),
      inset 0 1px 0 rgba(255, 255, 255, 0.28),
      0 0 0 0.5px rgba(255, 255, 255, 0.14);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .brand-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .brand-copy {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .brand-title {
    margin: 0;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.025em;
    line-height: 1.15;
    color: var(--ink);
  }

  .brand-status {
    font-size: 13px;
    font-weight: 400;
    color: var(--ink-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 180ms var(--ease-apple);
    font-variant-numeric: tabular-nums;
  }

  .brand-status.active {
    color: var(--accent);
    font-weight: 500;
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  /* Liquid Glass Floating Segmented Capsule */
  .segmented {
    position: relative;
    display: inline-grid;
    grid-template-columns: 1fr 1fr;
    padding: 3px;
    background: var(--glass-pill);
    -webkit-backdrop-filter: blur(28px) saturate(190%);
    backdrop-filter: blur(28px) saturate(190%);
    border-radius: var(--radius-pill);
    box-shadow: var(--glass-rim), var(--glass-outer-stroke), 0 4px 14px rgba(15, 23, 42, 0.05);
    flex-shrink: 0;
  }

  .segmented-thumb {
    position: absolute;
    top: 3px;
    left: 3px;
    width: calc(50% - 3px);
    height: calc(100% - 6px);
    background: var(--glass-thumb);
    border-radius: var(--radius-pill);
    box-shadow: var(--pill-shadow);
    transition: transform 240ms var(--ease-apple);
    pointer-events: none;
  }

  .segmented[data-mode="text"] .segmented-thumb {
    transform: translateX(100%);
  }

  .segmented button {
    position: relative;
    z-index: 1;
    appearance: none;
    border: none;
    background: transparent;
    padding: 6px 16px;
    font-family: var(--font-sans);
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink-secondary);
    cursor: pointer;
    border-radius: var(--radius-pill);
    transition: color 180ms var(--ease-apple);
    white-space: nowrap;
  }

  .segmented button.active {
    color: var(--ink);
  }

  /* Subtle Liquid Glass Light/Dark Toggle Orb */
  .theme-orb {
    appearance: none;
    border: none;
    width: 34px;
    height: 34px;
    border-radius: var(--radius-pill);
    background: var(--glass-pill);
    -webkit-backdrop-filter: blur(28px) saturate(190%);
    backdrop-filter: blur(28px) saturate(190%);
    box-shadow: var(--glass-rim), var(--glass-outer-stroke), 0 4px 12px rgba(15, 23, 42, 0.05);
    color: var(--ink-secondary);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: color 160ms var(--ease-apple), transform 140ms var(--ease-apple), background 180ms var(--ease-apple);
  }

  .theme-orb:hover {
    color: var(--ink);
  }

  .theme-orb:active {
    transform: scale(0.94);
  }

  .theme-orb svg {
    width: 15px;
    height: 15px;
    display: block;
  }

  /* --------------------------------------------------------------------------
     4. Focal Editor Liquid Glass Card (Content-First)
     -------------------------------------------------------------------------- */
  .editor-card {
    flex: 1 1 auto;
    min-height: 180px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: hidden;
  }

  .editor-bar {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 4px 12px 0 12px;
    flex-shrink: 0;
  }

  .editor-meta {
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-secondary);
    font-variant-numeric: tabular-nums;
  }

  .editor-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .quiet-btn {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink-secondary);
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 500;
    padding: 5px 11px;
    border-radius: var(--radius-pill);
    cursor: pointer;
    transition: background 150ms var(--ease-apple), color 150ms var(--ease-apple), transform 120ms var(--ease-apple), box-shadow 160ms var(--ease-apple);
  }

  .quiet-btn:hover {
    background: var(--control-fill);
    color: var(--ink);
  }

  .quiet-btn:active {
    transform: scale(0.965);
    background: var(--control-hover);
  }

  .quiet-btn.hidden {
    display: none;
  }

  .quiet-btn-pill {
    background: var(--glass-pill);
    box-shadow: var(--glass-rim), var(--glass-outer-stroke);
    color: var(--ink);
  }

  .quiet-btn-pill:hover {
    background: var(--glass-thumb);
  }

  /* Concentric Inner Crystal Well */
  .editor-well {
    position: relative;
    z-index: 1;
    flex: 1 1 auto;
    background: var(--glass-well);
    border-radius: var(--radius-well);
    box-shadow: inset 0 1px 3px rgba(15, 23, 42, 0.05), 0 0 0 0.5px var(--hairline);
    display: flex;
    min-height: 0;
    overflow: hidden;
    transition: box-shadow 180ms var(--ease-apple), background 240ms var(--ease-apple);
  }

  .editor-well:focus-within {
    box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.04), 0 0 0 2px var(--accent-ring);
  }

  #editor {
    width: 100%;
    height: 100%;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 400;
    line-height: 1.62;
    padding: 16px 20px;
    tab-size: 4;
    -moz-tab-size: 4;
    white-space: pre;
    overflow: auto;
    user-select: text;
    -webkit-user-select: text;
    caret-color: var(--accent);
  }

  #editor.wrapped {
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }

  #editor::placeholder {
    color: var(--ink-tertiary);
    font-family: var(--font-sans);
    font-size: 13.5px;
  }

  /* Subtle macOS Liquid Glass scrollbars */
  #editor::-webkit-scrollbar {
    width: 10px;
    height: 10px;
  }
  #editor::-webkit-scrollbar-track {
    background: transparent;
  }
  #editor::-webkit-scrollbar-thumb {
    background: var(--hairline-strong);
    border-radius: 8px;
    border: 2.5px solid transparent;
    background-clip: content-box;
  }
  #editor::-webkit-scrollbar-thumb:hover {
    background: var(--ink-tertiary);
    border: 2.5px solid transparent;
    background-clip: content-box;
  }
  #editor::-webkit-scrollbar-corner {
    background: transparent;
  }

  /* --------------------------------------------------------------------------
     5. Settings Liquid Glass Card (Strict 8px Grid)
     -------------------------------------------------------------------------- */
  .settings-card {
    padding: 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex-shrink: 0;
  }

  .settings-card > * {
    position: relative;
    z-index: 1;
  }

  .speed-block {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .row-between {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .label-primary {
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
  }

  .readout {
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink-secondary);
    font-variant-numeric: tabular-nums;
  }

  .slider-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .slider-end {
    font-size: 11.5px;
    color: var(--ink-tertiary);
    font-weight: 500;
    flex-shrink: 0;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 5px;
    border-radius: var(--radius-pill);
    background: var(--hairline-strong);
    box-shadow: inset 0 0.5px 1.5px rgba(15, 23, 42, 0.14);
    outline: none;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 24px;
    height: 16px;
    border-radius: var(--radius-pill);
    background: linear-gradient(180deg, #FFFFFF 0%, #F1F4FA 100%);
    box-shadow:
      0 2px 6px rgba(15, 23, 42, 0.20),
      0 0 0 0.5px rgba(15, 23, 42, 0.12),
      inset 0 1px 0 rgba(255, 255, 255, 0.95);
    transition: transform 150ms var(--ease-apple), box-shadow 150ms var(--ease-apple);
  }

  input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.06);
  }

  input[type="range"]::-webkit-slider-thumb:active {
    transform: scale(0.96);
    box-shadow: 0 0 0 4px var(--accent-ring), 0 2px 6px rgba(15, 23, 42, 0.24);
  }

  .divider {
    height: 1px;
    background: var(--hairline);
    width: 100%;
  }

  .controls-grid {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px 24px;
  }

  .toggle-item {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }

  .toggle-label {
    font-size: 13px;
    font-weight: 400;
    color: var(--ink);
  }

  /* Liquid Glass macOS Pill Switch */
  .switch {
    position: relative;
    width: 36px;
    height: 20px;
    flex-shrink: 0;
  }

  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
    position: absolute;
  }

  .switch-track {
    position: absolute;
    inset: 0;
    border-radius: var(--radius-pill);
    background: var(--switch-off);
    box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.14);
    transition: background 180ms var(--ease-apple), box-shadow 180ms var(--ease-apple);
  }

  .switch-track::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: var(--radius-pill);
    background: linear-gradient(180deg, #FFFFFF 0%, #F2F5FA 100%);
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.25), inset 0 1px 0 #FFFFFF;
    transition: transform 200ms var(--ease-apple), width 160ms var(--ease-apple);
  }

  .switch input:checked + .switch-track {
    background: linear-gradient(180deg, var(--accent-top) 0%, var(--accent) 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 1px 6px var(--accent-ring);
  }

  .switch input:checked + .switch-track::after {
    transform: translateX(16px);
  }

  /* Liquid Glass Stepper (Start Delay) */
  .stepper-group {
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }

  .stepper {
    display: inline-flex;
    align-items: center;
    background: var(--glass-pill);
    border-radius: var(--radius-pill);
    box-shadow: var(--glass-rim), var(--glass-outer-stroke);
    padding: 2px;
    gap: 2px;
  }

  .stepper button {
    appearance: none;
    border: none;
    background: transparent;
    width: 24px;
    height: 24px;
    border-radius: var(--radius-pill);
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-secondary);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 140ms var(--ease-apple), color 140ms var(--ease-apple);
  }

  .stepper button:hover {
    background: var(--glass-thumb);
    color: var(--ink);
  }

  .stepper-val {
    min-width: 34px;
    text-align: center;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  /* Smooth Collapsible Code Indentation Drawer */
  .code-drawer {
    display: grid;
    grid-template-rows: 1fr;
    opacity: 1;
    transition: grid-template-rows 240ms var(--ease-apple), opacity 200ms var(--ease-apple), margin-top 240ms var(--ease-apple);
  }

  .code-drawer.collapsed {
    grid-template-rows: 0fr;
    opacity: 0;
    margin-top: -16px;
    pointer-events: none;
  }

  .code-drawer-inner {
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Liquid Glass Compact Tab Width Capsule */
  .mini-segment {
    display: inline-flex;
    align-items: center;
    background: var(--glass-pill);
    border-radius: var(--radius-pill);
    box-shadow: var(--glass-rim), var(--glass-outer-stroke);
    padding: 2px;
    gap: 2px;
  }

  .mini-segment button {
    appearance: none;
    border: none;
    background: transparent;
    min-width: 28px;
    height: 24px;
    padding: 0 9px;
    border-radius: var(--radius-pill);
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-secondary);
    cursor: pointer;
    font-variant-numeric: tabular-nums;
    transition: background 160ms var(--ease-apple), color 160ms var(--ease-apple), box-shadow 160ms var(--ease-apple);
  }

  .mini-segment button.active {
    background: var(--glass-thumb);
    color: var(--ink);
    box-shadow: var(--pill-shadow);
  }

  /* --------------------------------------------------------------------------
     6. Action Footer (Luminous Hairline Progress + Liquid Glass Primary Capsule)
     -------------------------------------------------------------------------- */
  .footer {
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex-shrink: 0;
  }

  .progress-track {
    width: 100%;
    height: 4px;
    border-radius: var(--radius-pill);
    background: var(--hairline);
    overflow: hidden;
    opacity: 0;
    transition: opacity 220ms var(--ease-apple);
  }

  .progress-track.visible {
    opacity: 1;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent-top) 100%);
    border-radius: var(--radius-pill);
    box-shadow: 0 0 10px var(--accent-ring);
    transition: width 160ms var(--ease-apple);
  }

  .footer-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 0 4px;
  }

  .shortcuts {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 12px;
    color: var(--ink-secondary);
  }

  .shortcut-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .kbd {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 2px 7px;
    border-radius: 6px;
    background: var(--glass-pill);
    box-shadow: var(--glass-rim), var(--glass-outer-stroke);
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 500;
    color: var(--ink);
  }

  .footer-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  /* Floating Liquid Glass Primary Action Capsule */
  .primary-btn {
    position: relative;
    overflow: hidden;
    appearance: none;
    border: none;
    height: 40px;
    padding: 0 26px;
    border-radius: var(--radius-pill);
    background: linear-gradient(180deg, var(--accent-top) 0%, var(--accent) 100%);
    color: #FFFFFF;
    font-family: var(--font-sans);
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: -0.01em;
    cursor: pointer;
    box-shadow:
      0 4px 16px var(--accent-shadow),
      0 1px 2px rgba(15, 23, 42, 0.16),
      inset 0 1px 0.5px rgba(255, 255, 255, 0.42),
      inset 0 -1px 0 rgba(0, 0, 0, 0.14);
    transition: filter 160ms var(--ease-apple), transform 130ms var(--ease-apple), box-shadow 160ms var(--ease-apple), background 180ms var(--ease-apple);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-width: 152px;
    justify-content: center;
  }

  .primary-btn::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(
      140px circle at var(--mx, 50%) var(--my, 0%),
      rgba(255, 255, 255, 0.28) 0%,
      transparent 70%
    );
    opacity: 0.7;
  }

  .primary-btn:hover {
    filter: brightness(1.06);
  }

  .primary-btn:active {
    transform: scale(0.978);
  }

  .primary-btn.stopping {
    background: var(--stop-bg);
    color: var(--stop-fg);
    box-shadow:
      0 4px 16px rgba(15, 23, 42, 0.18),
      inset 0 1px 0.5px rgba(255, 255, 255, 0.30);
  }

  @keyframes fadeSlideIn {
    from {
      opacity: 0;
      transform: translateY(-4px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

<body class="__PLATFORM_CLASS__">
  <div class="app">

    <!-- Quiet macOS Permission Notice (hidden once granted) -->
    <div id="permBanner" class="glass-panel permission-banner">
      <div class="permission-copy">
        <div class="permission-title">macOS permission required</div>
        <div id="permDesc" class="permission-desc">Allow CynoType in Privacy &amp; Security so it can simulate keystrokes.</div>
      </div>
      <div class="permission-actions">
        <button id="btnOpenPerm" class="quiet-btn quiet-btn-pill" type="button">Open Settings</button>
        <button id="btnRecheckPerm" class="quiet-btn" type="button">Recheck</button>
      </div>
    </div>

    <!-- Header -->
    <header class="header">

        <div class="brand-icon">
          <img id="brandLogo" src="__LOGO_MARK_DATA__" alt="CynoType" />

          <button id="tabText" type="button" role="tab" aria-selected="false">Plain Text</button>
        </div>

        <button id="btnTheme" class="theme-orb" type="button" title="Switch Light / Dark Liquid Glass" aria-label="Toggle Liquid Glass appearance">
          <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Focal Editor Liquid Glass Card -->
    <section class="glass-panel editor-card">
      <div class="editor-bar">
        <div id="statsLabel" class="editor-meta">0 lines &middot; 0 characters</div>
        <div class="editor-actions">
          <button id="btnAutoDetect" class="quiet-btn" type="button" title="Analyze pasted code and configure tab width">Auto-Detect</button>
          <button id="btnPaste" class="quiet-btn" type="button">Paste</button>

    <!-- Quiet Tuning Liquid Glass Card -->
    <section class="glass-panel settings-card">
      <div class="speed-block">
        <div class="row-between">
          <span class="label-primary">Typing Speed</span>

        <div class="slider-wrap">

          <span class="switch">

        <div class="stepper-group">
          <span class="toggle-label">Delay</span>

            <button id="btnDelayDown" type="button" aria-label="Decrease delay">&minus;</button>
            <span id="delayValue" class="stepper-val">5 s</span>

          </div>
        </div>
      </div>

      <!-- Smart IDE Indentation Options (smoothly collapses in Plain Text mode) -->
      <div id="codeDrawer" class="code-drawer">
        <div class="code-drawer-inner">
          <div class="divider"></div>
          <div class="controls-grid">
            <label class="toggle-item" title="Types leading indentation using the Tab key instead of individual spaces">
              <span class="switch">

              <span class="switch">
                <input id="chkDismissPopup" type="checkbox" checked />
                <span class="switch-track"></span>
              </span>
              <span class="toggle-label">Dismiss autocomplete</span>
            </label>

            <label class="toggle-item">
              <span class="switch">
                <input id="chkWrap" type="checkbox" />
                <span class="switch-track"></span>
              </span>
              <span class="toggle-label">Wrap lines</span>

                <button type="button" data-spaces="2">2</button>
                <button type="button" data-spaces="4" class="active">4</button>
                <button type="button" data-spaces="8">8</button>

        <div id="progressFill" class="progress-fill"></div>
      </div>

      <div class="footer-bar">
        <div class="shortcuts">
          <span class="shortcut-item"><span id="kbdStart" class="kbd">&#8984;&#8617;</span> Start</span>
          <span id="kbdStopWrap" class="shortcut-item"><span class="kbd">Esc</span> or <span class="kbd">F8</span> Stop</span>
        </div>

        <div class="footer-actions">
          <button id="btnReset" class="quiet-btn" type="button">Reset</button>
          <button id="btnPrimary" class="primary-btn" type="button">Start Typing</button>
        </div>
      </div>
    </footer>

  </div>

<script>
(function() {
  const state = {
    mode: "code", // "code" | "text"
    theme: "light", // "light" | "dark"
    delaySec: 5,
    spacesPerTab: 4,
    running: false,
    permPane: "Privacy_Accessibility"
  };

  const els = {
    permBanner: document.getElementById("permBanner"),
    permDesc: document.getElementById("permDesc"),
    btnOpenPerm: document.getElementById("btnOpenPerm"),
    btnRecheckPerm: document.getElementById("btnRecheckPerm"),
    statusLine: document.getElementById("statusLine"),
    modeSegmented: document.getElementById("modeSegmented"),
    tabCode: document.getElementById("tabCode"),
    tabText: document.getElementById("tabText"),
    btnTheme: document.getElementById("btnTheme"),
    iconMoon: document.getElementById("iconMoon"),
    iconSun: document.getElementById("iconSun"),
    statsLabel: document.getElementById("statsLabel"),
    btnAutoDetect: document.getElementById("btnAutoDetect"),
    btnPaste: document.getElementById("btnPaste"),
    btnClear: document.getElementById("btnClear"),
    editor: document.getElementById("editor"),
    speedSlider: document.getElementById("speedSlider"),
    speedReadout: document.getElementById("speedReadout"),
    chkHumanize: document.getElementById("chkHumanize"),
    chkMinimize: document.getElementById("chkMinimize"),
    btnDelayDown: document.getElementById("btnDelayDown"),
    btnDelayUp: document.getElementById("btnDelayUp"),
    delayValue: document.getElementById("delayValue"),
    codeDrawer: document.getElementById("codeDrawer"),
    chkUseTab: document.getElementById("chkUseTab"),
    chkDismissPopup: document.getElementById("chkDismissPopup"),
    chkWrap: document.getElementById("chkWrap"),
    tabWidthGroup: document.getElementById("tabWidthGroup"),
    progressTrack: document.getElementById("progressTrack"),
    progressFill: document.getElementById("progressFill"),
    btnReset: document.getElementById("btnReset"),
    btnPrimary: document.getElementById("btnPrimary")
  };

  function post(action, payload) {
    const msg = Object.assign({ action: action }, payload || {});
    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.bridge) {
        window.webkit.messageHandlers.bridge.postMessage(msg);
      } else if (window.pywebview && window.pywebview.api && window.pywebview.api.dispatch) {
        window.pywebview.api.dispatch(msg);
      }
    } catch (e) {}
  }

  // Subtle Liquid Glass specular pointer reflection
  document.querySelectorAll(".glass-panel, .primary-btn").forEach(function(panel) {
    panel.addEventListener("pointermove", function(e) {
      const r = panel.getBoundingClientRect();
      const x = ((e.clientX - r.left) / Math.max(1, r.width)) * 100;
      const y = ((e.clientY - r.top) / Math.max(1, r.height)) * 100;
      panel.style.setProperty("--mx", x.toFixed(1) + "%");
      panel.style.setProperty("--my", y.toFixed(1) + "%");
    });
  });

  function setTheme(theme, persist) {
    state.theme = theme === "dark" ? "dark" : "light";
    const isDark = state.theme === "dark";
    document.body.classList.toggle("theme-dark", isDark);
    els.iconMoon.style.display = isDark ? "none" : "block";
    els.iconSun.style.display = isDark ? "block" : "none";
    updateSpeedReadout();
    if (persist) {
      try { localStorage.setItem("cynotype-theme", state.theme); } catch (e) {}
    }
    post("set_theme", { theme: state.theme });
  }

  function updateStats() {
    const raw = els.editor.value;
    const chars = raw.length;
    const lines = raw.length === 0 ? 0 : raw.split("\n").length;
    const lineWord = lines === 1 ? "line" : "lines";
    const charWord = chars === 1 ? "character" : "characters";
    els.statsLabel.textContent = lines.toLocaleString() + " " + lineWord + " \u00B7 " + chars.toLocaleString() + " " + charWord;
  }

  function updateSpeedReadout() {
    const ms = Number(els.speedSlider.value);
    const cps = ms > 0 ? 1000 / ms : 0;
    const wpm = Math.round((cps * 60) / 5);
    els.speedReadout.textContent = ms + " ms \u00B7 ~" + wpm + " WPM";
    const pct = ((ms - 10) / (250 - 10)) * 100;
    els.speedSlider.style.background =
      "linear-gradient(to right, var(--accent) 0%, var(--accent-top) " + pct + "%, var(--hairline-strong) " + pct + "%, var(--hairline-strong) 100%)";
  }

  function setMode(mode) {
    state.mode = mode;
    els.modeSegmented.setAttribute("data-mode", mode);
    const isCode = mode === "code";
    els.tabCode.classList.toggle("active", isCode);
    els.tabText.classList.toggle("active", !isCode);
    els.tabCode.setAttribute("aria-selected", String(isCode));
    els.tabText.setAttribute("aria-selected", String(!isCode));
    els.codeDrawer.classList.toggle("collapsed", !isCode);
    els.btnAutoDetect.classList.toggle("hidden", !isCode);
    if (!isCode) {
      els.editor.classList.add("wrapped");
    } else {
      els.editor.classList.toggle("wrapped", els.chkWrap.checked);
    }
  }

  function setSpacesPerTab(spaces) {
    state.spacesPerTab = spaces;
    els.editor.style.tabSize = String(spaces);
    els.editor.style.MozTabSize = String(spaces);
    const btns = els.tabWidthGroup.querySelectorAll("button");
    btns.forEach(function(b) {
      b.classList.toggle("active", Number(b.getAttribute("data-spaces")) === spaces);
    });
  }

  function setDelay(sec) {
    state.delaySec = Math.max(1, Math.min(30, sec));
    els.delayValue.textContent = state.delaySec + " s";
  }

  function setStatus(text, isActive) {
    els.statusLine.textContent = text;
    els.statusLine.classList.toggle("active", Boolean(isActive));
  }

  function setRunningUI(running) {
    state.running = running;
    if (running) {
      els.btnPrimary.textContent = "Stop Typing";
      els.btnPrimary.classList.add("stopping");
      els.progressTrack.classList.add("visible");
    } else {
      els.btnPrimary.textContent = "Start Typing";
      els.btnPrimary.classList.remove("stopping");
    }
  }

  function triggerStart() {
    if (state.running) {
      post("stop", { source: "Stop button" });
      return;
    }
    const text = els.editor.value;
    if (!text) {
      setStatus("Paste or type some content first", false);
      els.editor.focus();
      return;
    }
    post("start", {
      text: text,
      base_delay_ms: Number(els.speedSlider.value),
      randomize: els.chkHumanize.checked,
      auto_minimize: els.chkMinimize.checked,
      start_delay: state.delaySec,
      code_mode: state.mode === "code",
      dismiss_autocomplete: els.chkDismissPopup.checked,
      use_tab_key: els.chkUseTab.checked,
      spaces_per_tab: state.spacesPerTab
    });
  }

  function insertTextClean(text) {
    const normalized = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
    els.editor.focus();
    const ok = document.execCommand("insertText", false, normalized);
    if (!ok) {
      const start = els.editor.selectionStart;
      const end = els.editor.selectionEnd;
      els.editor.value = els.editor.value.slice(0, start) + normalized + els.editor.value.slice(end);
      els.editor.selectionStart = els.editor.selectionEnd = start + normalized.length;
    }
    updateStats();
  }

  function handleEditorKeydown(e) {
    if (e.key === "Tab") {
      e.preventDefault();
      const ta = els.editor;
      const val = ta.value;
      const selStart = ta.selectionStart;
      const selEnd = ta.selectionEnd;

      if (!e.shiftKey && selStart === selEnd) {
        insertTextClean("\t");
        return;
      }

      const lineStart = val.lastIndexOf("\n", selStart - 1) + 1;
      let lineEnd = val.indexOf("\n", selEnd);
      if (lineEnd === -1) lineEnd = val.length;
      if (selEnd > lineStart && val[selEnd - 1] === "\n") {
        lineEnd = selEnd - 1;
      }

      const block = val.slice(lineStart, lineEnd);
      const lines = block.split("\n");
      let updatedLines;

      if (!e.shiftKey) {
        updatedLines = lines.map(function(l) { return "\t" + l; });
      } else {
        const sp = state.spacesPerTab;
        const spPrefix = " ".repeat(sp);
        updatedLines = lines.map(function(l) {
          if (l.startsWith("\t")) return l.slice(1);
          if (l.startsWith(spPrefix)) return l.slice(sp);
          if (l.startsWith(" ")) {
            const lead = l.length - l.trimStart().length;
            return l.slice(Math.min(sp, lead));
          }
          return l;
        });
      }

      const replaced = updatedLines.join("\n");
      ta.setSelectionRange(lineStart, lineEnd);
      const ok = document.execCommand("insertText", false, replaced);
      if (!ok) {
        ta.value = val.slice(0, lineStart) + replaced + val.slice(lineEnd);
      }
      ta.setSelectionRange(lineStart, lineStart + replaced.length);
      updateStats();
    }
  }

  els.editor.addEventListener("paste", function(e) {
    if (e.clipboardData) {
      const raw = e.clipboardData.getData("text/plain");
      if (typeof raw === "string") {
        e.preventDefault();
        const wasEmpty = els.editor.value.trim().length === 0;
        insertTextClean(raw);
        if (wasEmpty && state.mode === "code") {
          post("auto_detect", { text: els.editor.value, silent: true });
        }
      }
    }
  });

  els.editor.addEventListener("input", updateStats);
  els.editor.addEventListener("keydown", handleEditorKeydown);

  window.addEventListener("keydown", function(e) {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
      e.preventDefault();
      if (!state.running) triggerStart();
      return;
    }
    if (e.key === "F6") {
      e.preventDefault();
      if (!state.running) triggerStart();
      return;
    }
    if ((e.key === "Escape" || e.key === "F8") && state.running) {
      e.preventDefault();
      post("stop", { source: "Hotkey (" + e.key.toUpperCase() + ")" });
    }
  });

  els.tabCode.addEventListener("click", function() { setMode("code"); });
  els.tabText.addEventListener("click", function() { setMode("text"); });
  els.btnTheme.addEventListener("click", function() {
    setTheme(state.theme === "dark" ? "light" : "dark", true);
  });

  els.speedSlider.addEventListener("input", updateSpeedReadout);
  els.btnDelayDown.addEventListener("click", function() { setDelay(state.delaySec - 1); });
  els.btnDelayUp.addEventListener("click", function() { setDelay(state.delaySec + 1); });

  els.chkWrap.addEventListener("change", function() {
    if (state.mode === "code") {
      els.editor.classList.toggle("wrapped", els.chkWrap.checked);
    }
  });

  els.tabWidthGroup.querySelectorAll("button").forEach(function(btn) {
    btn.addEventListener("click", function() {
      setSpacesPerTab(Number(btn.getAttribute("data-spaces")));
    });
  });

  els.btnPaste.addEventListener("click", function() { post("request_paste"); });
  els.btnAutoDetect.addEventListener("click", function() {
    post("auto_detect", { text: els.editor.value, silent: false });
  });
  els.btnClear.addEventListener("click", function() {
    els.editor.value = "";
    updateStats();
    els.editor.focus();
  });
  els.btnReset.addEventListener("click", function() {
    post("request_reset", { has_text: els.editor.value.trim().length > 0 });
  });
  els.btnPrimary.addEventListener("click", triggerStart);
  els.btnOpenPerm.addEventListener("click", function() {
    post("open_permissions", { pane: state.permPane });
  });
  els.btnRecheckPerm.addEventListener("click", function() {
    post("check_permissions");
  });

  window.CynoBridge = {
    setTheme: function(theme) {
      setTheme(theme, false);
    },

    onPasteText: function(text) {
      if (!text) return;
      const wasEmpty = els.editor.value.trim().length === 0;
      insertTextClean(text);
      if (wasEmpty && state.mode === "code") {
        post("auto_detect", { text: els.editor.value, silent: true });
      }
    },

    onAutoDetectResult: function(spaces, useTab, msg, silent) {
      if (spaces === 2 || spaces === 4 || spaces === 8) {
        setSpacesPerTab(spaces);
      } else {
        state.spacesPerTab = spaces;
        els.editor.style.tabSize = String(spaces);
      }
      if (typeof useTab === "boolean") {
        els.chkUseTab.checked = useTab;
      }
      if (!silent && msg) {
        setStatus(msg, false);
      }
    },

    onPerformReset: function() {
      els.editor.value = "";
      els.speedSlider.value = "45";
      updateSpeedReadout();
      els.chkHumanize.checked = true;
      els.chkMinimize.checked = true;
      setDelay(5);
      setMode("code");
      els.chkUseTab.checked = true;
      els.chkDismissPopup.checked = true;
      els.chkWrap.checked = false;
      els.editor.classList.remove("wrapped");
      setSpacesPerTab(4);
      els.progressFill.style.width = "0%";
      els.progressTrack.classList.remove("visible");
      setRunningUI(false);
      setStatus("Reset to defaults", false);
      updateStats();
    },

    onPermissions: function(canType, canListen, desc, pane) {
      if (canType && canListen) {
        els.permBanner.classList.remove("visible");
      } else {
        els.permDesc.textContent = desc;
        state.permPane = pane || "Privacy_Accessibility";
        els.permBanner.classList.add("visible");
      }
    },

    onStarted: function() {
      setRunningUI(true);
      els.progressFill.style.width = "0%";
    },

    onStatus: function(msg, isActive) {
      setStatus(msg, isActive);
    },

    onProgress: function(pct, msg) {
      els.progressTrack.classList.add("visible");
      els.progressFill.style.width = Math.max(0, Math.min(100, pct)) + "%";
      setStatus(msg, true);
    },

    onFinished: function(totalChars) {
      setRunningUI(false);
      els.progressFill.style.width = "100%";
      setStatus("Finished \u00B7 " + totalChars.toLocaleString() + " characters typed", false);
      setTimeout(function() {
        if (!state.running) {
          els.progressTrack.classList.remove("visible");
          els.progressFill.style.width = "0%";
        }
      }, 1400);
    },

    onStopped: function(reason) {
      setRunningUI(false);
      els.progressTrack.classList.remove("visible");
      els.progressFill.style.width = "0%";
      setStatus("Stopped \u00B7 " + reason, false);
    }
  };

  if (document.body.classList.contains("platform-win")) {
    const kbdStart = document.getElementById("kbdStart");
    const kbdStopWrap = document.getElementById("kbdStopWrap");
    if (kbdStart) kbdStart.textContent = "Ctrl+Enter";
    if (kbdStopWrap) kbdStopWrap.innerHTML = '<span class="kbd">F8</span> Stop';
  }

  // Restore saved appearance (defaults to luminous Light Liquid Glass)
  let savedTheme = "light";
  try {
    const stored = localStorage.getItem("cynotype-theme");
    if (stored === "dark" || stored === "light") savedTheme = stored;
  } catch (e) {}

  setTheme(savedTheme, false);
  updateStats();
  setMode("code");
  setSpacesPerTab(4);
  setDelay(5);
  post("ui_ready");
  window.addEventListener("pywebviewready", function() {
    post("ui_ready");
  });
})();
</script>
</body>
</html>
